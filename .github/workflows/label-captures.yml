name: Label captures
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: label-captures
  cancel-in-progress: false
jobs:
  label:
    if: github.repository == 'spatattack/backyard-camera'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: cloud/requirements.txt
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/huggingface/hub
          key: backyard-model-${{ runner.os }}-${{ hashFiles('cloud/labeller.py') }}
      - run: python -m pip install -r cloud/requirements.txt
      - run: python cloud/labeller.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
